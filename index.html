<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hermes Typewriter — e-ink chat interface for hermes-agent">
  <title>Hermes Typewriter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header id="header">
    <div class="header-row">
      <h1 id="title">HERMES</h1>
      <div class="header-meta">
        <span id="mode-badge" class="mode-badge">&#x25CE; STREAM</span>
        <span id="status" class="status status--offline">&#x25CB; OFFLINE</span>
      </div>
    </div>
    <div class="rule rule--heavy"></div>
  </header>

  <!-- ====== SESSION LIST VIEW ====== -->
  <section id="sessions-view" class="view">

    <div class="section-bar">
      <span class="section-label">Sessions</span>
      <button id="new-session-btn" class="btn btn--sm" aria-label="Create new session">[+ NEW]</button>
    </div>

    <!-- New session inline form -->
    <div id="new-session-form" class="inline-form" style="display:none">
      <label for="new-session-input">Session ID:</label>
      <input
        type="text"
        id="new-session-input"
        class="input"
        placeholder="my-project-2024"
        autocomplete="off"
        maxlength="64"
        pattern="[a-zA-Z0-9_-]+"
        title="Letters, numbers, hyphens and underscores only (3-64 chars)"
      />
      <div id="new-session-error" class="form-error" style="display:none"></div>
      <div class="inline-form-actions">
        <button id="new-session-cancel" class="btn btn--sm" aria-label="Cancel">[CANCEL]</button>
        <button id="new-session-create" class="btn btn--sm btn--primary" aria-label="Create session">[CREATE]</button>
      </div>
    </div>

    <!-- Session list -->
    <div id="sessions-list" class="threads-list"></div>

    <div id="sessions-empty" class="empty-state">
      <p>No sessions yet.</p>
      <p class="muted">Press [+ NEW] to begin a named conversation.</p>
    </div>

    <div class="rule"></div>

    <!-- Join existing session by ID -->
    <div class="section-bar">
      <span class="section-label">Rejoin</span>
    </div>
    <div class="rejoin-form">
      <label for="rejoin-input">Session ID:</label>
      <input type="text" id="rejoin-input" class="input" placeholder="existing-session-id" autocomplete="off" maxlength="64" />
      <div id="rejoin-error" class="form-error" style="display:none"></div>
      <button id="rejoin-btn" class="btn btn--sm" aria-label="Rejoin session">[JOIN]</button>
    </div>

    <div class="rule"></div>

    <!-- Settings -->
    <button id="settings-toggle" class="btn btn--block btn--subtle" aria-label="Toggle settings">[SETTINGS]</button>
    <div id="settings-panel" style="display:none">
      <div class="settings-field">
        <label for="setting-url">Server:</label>
        <div class="input-group">
          <input type="text" id="setting-url" class="input" />
          <button id="test-connection-btn" class="btn btn--sm" aria-label="Test connection">[TEST]</button>
        </div>
      </div>
      <div class="settings-field">
        <label for="setting-key">API Key:</label>
        <input type="password" id="setting-key" class="input" placeholder="Bearer token" />
      </div>
      <div class="settings-field">
        <span class="settings-label">Mode:</span>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="setting-mode" id="setting-mode-streaming" value="streaming" />
            <span>Stream</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="setting-mode" id="setting-mode-responses" value="responses" />
            <span>Responses</span>
          </label>
        </div>
        <div class="mode-hint" id="mode-hint"></div>
      </div>
      <div class="settings-field">
        <label for="setting-max-turns">Max turns shown:</label>
        <input type="number" id="setting-max-turns" class="input input--narrow" min="2" max="100" />
      </div>
      <div class="settings-field">
        <label class="checkbox-label">
          <input type="checkbox" id="setting-dark-mode" />
          <span>Dark Mode (High Contrast)</span>
        </label>
      </div>
      <button id="settings-save" class="btn btn--sm btn--primary" aria-label="Save settings">[SAVE]</button>
    </div>
  </section>

  <!-- ====== CHAT VIEW ====== -->
  <section id="chat-view" class="view" style="display:none">

    <div class="section-bar">
      <button id="back-btn" class="btn btn--sm" aria-label="Go back">[&lt;- BACK]</button>
      <span id="session-title" class="thread-title"></span>
      <span id="chat-mode-badge" class="mode-badge mode-badge--sm"></span>
    </div>

    <!-- Load earlier messages (responses mode paging / streaming scroll) -->
    <div id="load-earlier" style="display:none">
      <button id="load-earlier-btn" class="btn btn--block btn--subtle">
        [Load earlier messages...]
      </button>
    </div>

    <!-- Messages area -->
    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Chat messages"></main>

    <!-- Typing indicator -->
    <div id="typing-indicator" class="typing-indicator" style="display:none">
      <span class="muted">HERMES IS WRITING...</span>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <textarea
        id="message-input"
        class="message-input"
        rows="2"
        placeholder="Type your message..."
        aria-label="Message input"
      ></textarea>
      <button id="send-btn" class="btn btn--primary btn--send" aria-label="Send message">[SEND]</button>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
